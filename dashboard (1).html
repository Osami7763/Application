<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظم المهام الذكي 🚀</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --accent: #f43f5e;
            --bg: #0f172a;
            --card: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --gold: #ffd700;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: var(--text);
            margin: 0;
            padding-bottom: 90px;
            min-height: 100vh;
            transition: 0.5s ease;
        }

        .container { max-width: 500px; margin: 0 auto; padding: 20px; }

        .page { display: none; animation: fadeIn 0.4s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .glass-card {
            background: var(--card);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }

        .bottom-nav {
            position: fixed; bottom: 15px; left: 15px; right: 15px;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(20px);
            display: flex; justify-content: space-around;
            padding: 12px 0; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 1000;
        }

        .nav-item {
            color: #94a3b8; text-decoration: none; font-size: 11px;
            display: flex; flex-direction: column; align-items: center;
            cursor: pointer; transition: 0.3s; width: 33%;
        }
        .nav-item.active { color: var(--primary); transform: translateY(-3px); }
        .nav-item i { font-size: 20px; margin-bottom: 4px; }

        .task-item {
            background: rgba(255,255,255,0.05); padding: 15px;
            border-radius: 15px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
            border-right: 4px solid var(--primary);
        }

        input, button {
            width: 100%; padding: 14px; margin: 8px 0;
            border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
            background: #0f172a; color: white; box-sizing: border-box;
        }

        .btn-main { background: var(--primary); border: none; font-weight: bold; cursor: pointer; }
        .btn-done { width: auto; background: #10b981; padding: 5px 15px; margin: 0; cursor: pointer; border: none; border-radius: 8px; }

        .tier-box { padding: 15px; border-radius: 18px; margin-bottom: 15px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); text-align: center; position: relative; }
        .tier-box.active { border: 2px solid var(--primary); background: rgba(99, 102, 241, 0.1); }
        .tier-box.locked { opacity: 0.4; filter: grayscale(1); }
        .badge-active { position: absolute; top: 10px; left: 10px; background: #10b981; font-size: 10px; padding: 3px 8px; border-radius: 5px; color: white; }

        .info-value { background: rgba(0,0,0,0.2); padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; margin-top: 5px;}
        .pass-hide { filter: blur(5px); cursor: pointer; }
        .pass-hide:hover { filter: blur(0); }
    </style>
</head>
<body>

<div class="container">
    
    <div id="tasksPage" class="page active">
        <h2 id="welcomeMsg">جاري التحميل.. ✨</h2>
        <div class="glass-card">
            <input type="text" id="taskTitle" placeholder="وش تبي تنجز اليوم؟">
            <input type="datetime-local" id="taskTime">
            <button class="btn-main" onclick="addTask()">إضافة للمهام 💾</button>
        </div>
        <div id="taskList"></div>
    </div>

    <div id="subPage" class="page">
        <h2>تحدي الـ 24 ساعة 🏆</h2>
        <div class="glass-card" style="text-align: center;">
            <p>نقاط إنجازك اليوم</p>
            <h1 id="statDone" style="color: var(--primary); font-size: 50px; margin: 5px 0;">0</h1>
        </div>
        <div id="tierBronze" class="tier-box"><h3>🥉 برونزي</h3><p>حد 5 مهام نشطة</p></div>
        <div id="tierSilver" class="tier-box locked"><h3>🥈 فضي</h3><p>مهام غير محدودة</p></div>
        <div id="tierGold" class="tier-box locked"><h3>👑 ذهبي</h3><p>ثيم ملكي خاص</p></div>
    </div>

    <div id="profilePage" class="page">
        <h2>ملفي الشخصي 👤</h2>
        <div class="glass-card">
            <div style="text-align: center; margin-bottom: 20px;">
                <div style="width: 60px; height: 60px; background: var(--primary); border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 25px; color: white;">
                    <i class="fas fa-user"></i>
                </div>
                <h3 id="uNameDisplay" style="margin:0;">..</h3>
                <div id="uLevelBadge" style="font-size: 13px; margin-top: 8px; font-weight: bold;"></div>
            </div>
            <div style="text-align: right;">
                <label style="font-size: 12px; color: #94a3b8;">البريد الإلكتروني</label>
                <div class="info-value" id="uEmailDisplay">..</div>
                <br>
                <label style="font-size: 12px; color: #94a3b8;">كلمة المرور</label>
                <div class="info-value"><span id="uPassDisplay" class="pass-hide">********</span></div>
            </div>
            <button onclick="logout()" style="background: var(--accent); border: none; margin-top: 20px; font-weight: bold; cursor: pointer;">تسجيل الخروج</button>
        </div>
    </div>

</div>

<div class="bottom-nav">
    <div class="nav-item active" onclick="showPage('tasksPage', this)"><i class="fas fa-tasks"></i><span>مهامي</span></div>
    <div class="nav-item" onclick="showPage('subPage', this)"><i class="fas fa-crown"></i><span>المستويات</span></div>
    <div class="nav-item" onclick="showPage('profilePage', this)"><i class="fas fa-user-cog"></i><span>الحساب</span></div>
</div>

<script>
    const userEmail = localStorage.getItem('userEmail');
    const EXPIRY_TIME = 24 * 60 * 60 * 1000; // 24 ساعة بالملي ثانية

    // فحص الدخول
    if (!userEmail) window.location.href = "index.html"; 

    let myTasks = JSON.parse(localStorage.getItem(userEmail + '_tasks')) || [];
    let doneCount = parseInt(localStorage.getItem(userEmail + '_done')) || 0;

    window.onload = () => {
        // --- تعديل مشكلة الاسم هنا ---
        const storedName = localStorage.getItem('userName') || "صديقي";
        document.getElementById('welcomeMsg').innerText = `هلا بك يا ${storedName} ✨`;
        document.getElementById('uNameDisplay').innerText = storedName;
        document.getElementById('uEmailDisplay').innerText = userEmail;
        
        renderTasks();
        updateTiers();
        fetchPassword();
    };

    async function fetchPassword() {
        try {
            const res = await fetch(`https://sheetdb.io/api/v1/zfjboqznl1mrg/search?email=${userEmail}`);
            const data = await res.json();
            if (data.length > 0) document.getElementById('uPassDisplay').innerText = data[0].password;
        } catch (e) {}
    }

    function addTask() {
        const title = document.getElementById('taskTitle').value;
        const time = document.getElementById('taskTime').value;
        if (!title || !time) return alert("سجل بيانات المهمة أولاً!");

        // قيد المستوى البرونزي
        if (doneCount < 10 && myTasks.length >= 5) {
            return alert("⚠️ البرونزي حده 5 مهام نشطة. خلص مهامك عشان تترقى!");
        }

        myTasks.push({ id: Date.now(), title, time });
        localStorage.setItem(userEmail + '_tasks', JSON.stringify(myTasks));
        document.getElementById('taskTitle').value = "";
        renderTasks();
    }

    function renderTasks() {
        const list = document.getElementById('taskList');
        list.innerHTML = "";
        myTasks.forEach(t => {
            const div = document.createElement('div');
            div.className = 'task-item';
            div.innerHTML = `<div><b>${t.title}</b><br><small>${t.time.replace('T', ' ')}</small></div>
                             <button class="btn-done" onclick="completeTask(${t.id})">تم ✅</button>`;
            list.appendChild(div);
        });
    }

    function completeTask(id) {
        myTasks = myTasks.filter(t => t.id !== id);
        localStorage.setItem(userEmail + '_tasks', JSON.stringify(myTasks));
        
        doneCount++;
        localStorage.setItem(userEmail + '_done', doneCount);

        // تسجيل وقت الترقية لأول مرة
        if (doneCount === 10 || doneCount === 50) {
            localStorage.setItem(userEmail + '_upgradeTime', new Date().getTime());
        }

        renderTasks();
        updateTiers();
    }

    function updateTiers() {
        const now = new Date().getTime();
        let upgradeTime = localStorage.getItem(userEmail + '_upgradeTime');

        // نظام التصفير بعد 24 ساعة
        if (upgradeTime && (now - upgradeTime > EXPIRY_TIME)) {
            doneCount = 0;
            localStorage.setItem(userEmail + '_done', 0);
            localStorage.removeItem(userEmail + '_upgradeTime');
            alert("⏰ انتهت صلاحية مستواك! ابدأ تحدي جديد اليوم.");
        }

        document.getElementById('statDone').innerText = doneCount;
        const t1 = document.getElementById('tierBronze'), t2 = document.getElementById('tierSilver'), t3 = document.getElementById('tierGold');
        const badge = document.getElementById('uLevelBadge');
        
        [t1, t2, t3].forEach(t => { t.classList.remove('active'); t.classList.add('locked'); });

        if (doneCount >= 50) {
            applyTheme('#ffd700', "radial-gradient(circle at top right, #1a1a1a, #000000)");
            t3.classList.replace('locked', 'active');
            badge.innerHTML = '<span style="color:var(--gold)">👑 أسطورة اليوم</span>';
        } else if (doneCount >= 10) {
            applyTheme('#a855f7', "radial-gradient(circle at top right, #2e1065, #0f172a)");
            t2.classList.replace('locked', 'active');
            badge.innerHTML = '<span style="color:#a855f7">⭐ مجتهد اليوم</span>';
        } else {
            applyTheme('#6366f1', "radial-gradient(circle at top right, #1e1b4b, #0f172a)");
            t1.classList.remove('locked'); t1.classList.add('active');
            badge.innerHTML = '<span style="color:#94a3b8">🌱 مبتدئ</span>';
        }
    }

    function applyTheme(primary, bg) {
        document.documentElement.style.setProperty('--primary', primary);
        document.body.style.background = bg;
    }

    function showPage(pageId, element) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        element.classList.add('active');
    }

    function logout() { 
        localStorage.removeItem('userEmail');
        localStorage.removeItem('userName');
        window.location.href = "index.html"; 
    }
</script>
</body>
</html>
